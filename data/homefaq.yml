# Short questions shown on the homepage. The full list lives in content/faq.md.

items:
- q: Do you sell the products shown here?
  a: Yes. Simply Cozy Homes is a home decor and essentials store. Use the product button to view the latest item details and available options.
- q: Where can I see the current price?
  a: Current pricing appears with the product when ordering is available. Review the full item details before completing your purchase.
- q: How do I know whether an item fits my space?
  a: Check the measurements and product notes, then compare them with your room, cabinet or wall. If you are unsure, contact us before ordering.
- q: Can I return an item?
  a: Return eligibility depends on the item and its condition. Visit Shipping & Returns for the current process, or contact us with your order details.
- q: What if my order arrives damaged?
  a: Contact us with your order details and clear photos of the item and packaging. We will review the issue and explain the available next step.

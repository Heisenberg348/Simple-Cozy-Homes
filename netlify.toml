# ==========================================================================
#  Simply Cozy Homes - Netlify configuration (Hugo version)
# ==========================================================================

[build]
  # Netlify now builds the site with Hugo and publishes the "public" folder.
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.148.2"

# --------------------------------------------------------------------------
#  Force one version of the domain.
# --------------------------------------------------------------------------
[[redirects]]
  from = "https://simplycozyhomes.com/*"
  to = "https://www.simplycozyhomes.com/:splat"
  status = 301
  force = true

# --------------------------------------------------------------------------
#  Security and privacy headers. These do not change how the site looks.
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

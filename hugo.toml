# ==========================================================================
#  Simply Cozy Homes - site settings
#  Almost everything you would want to change is in this file or in /data.
# ==========================================================================

baseURL = "https://admirable-cucurucho-c82cd2.netlify.app/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Simply Cozy Homes"

# Keeps web addresses looking like /about.html, exactly like the old site.
uglyURLs = true
enableRobotsTXT = false
buildFuture = true

[permalinks]
  # Articles stay at the top level: /kitchen-tools-worth-buying.html
  blog = "/:slug"

[markup.goldmark.renderer]
  # Lets you drop plain HTML into a markdown file when you need to.
  unsafe = true

[params]
  siteName = "Simply Cozy Homes"
  tagline = "Home decor & essentials"
  email = "info@simplycozyhomes.com"
  description = "Shop practical home essentials and warm, easy-to-live-with decor for kitchens, bedrooms, rentals and small spaces."
  defaultImage = "images/hero.jpg"
  footerBlurb = "Thoughtful home decor and useful everyday essentials for calmer, more comfortable spaces."
  copyrightLine = "© 2026 Simply Cozy Homes. All rights reserved."
  legalNote = "Product details and availability can change. Please review the current item information before ordering. Questions about an order? Contact info@simplycozyhomes.com."
  authorName = "Simply Cozy Homes"
  authorRole = "Editorial team"

# ---- Top menu ------------------------------------------------------------
[[params.nav]]
  name = "Home"
